// 新增的智能跳转函数
function jump3() {
  const inputText = document.getElementById('customUrl').value.trim();
  
  if (!inputText) {
    alert('请输入内容');
    return;
  }
  
  // 判断是否为URL
  if (isValidURL(inputText)) {
    // 如果是有效的URL，直接跳转
    location.href = inputText;
  } else {
    // 如果不是URL，使用geneJumpLink函数处理
    const processedUrl = geneJumpLink(inputText);
    if (processedUrl) {
      location.href = processedUrl;
    } else {
      alert('无法处理该输入内容');
    }
  }
}

// URL验证函数[5,6](@ref)
function isValidURL(text) {
  try {
    // 使用URL构造函数验证[6](@ref)
    new URL(text);
    return true;
  } catch (_) {
    // 如果URL构造函数失败，尝试正则表达式验证
    return text.includes('://');
  }
}
